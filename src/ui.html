<style>
:root { --bg:#fafaf9; --fg:#1c1b1a; --muted:#6b6966; --line:#e7e5e2; --field:#f2f1ef; --accent:#0f7b4a; --danger:#b42318; --r:8px;
  --mono: ui-monospace, "Cascadia Mono", "SF Mono", Menlo, Consolas, monospace; }
@media (prefers-color-scheme: dark) { :root { --bg:#121110; --fg:#ecebe9; --muted:#9a9894; --line:#2a2826; --field:#1b1a19; --accent:#5fd38d; --danger:#f97066; } }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif; }
main { max-width: 640px; margin: 0 auto; padding: 16px 16px 12px; display: grid; gap: 12px; }
h1 { margin: 0; font-size: 18px; font-weight: 600; text-align: center; letter-spacing: -0.01em; }
p, dl, dd, ol, ul { margin: 0; }
svg { width: 16px; height: 16px; fill: currentColor; flex: none; }
.visual { width: auto; height: 64px; justify-self: center; color: var(--muted); }
form { display: grid; gap: 12px; }
label { display: grid; gap: 4px; align-content: start; font-size: 13px; color: var(--muted); }
input { width: 100%; min-height: 40px; padding: 8px 10px; font: inherit; font-size: 15px; color: var(--fg); background: var(--field); border: 1px solid var(--line); border-radius: var(--r); }
input::placeholder { color: var(--muted); opacity: 1; }
#domain { font-family: var(--mono); }
.help { font-size: 13px; color: var(--muted); }
.row { display: grid; grid-template-columns: 5fr 3fr; gap: 12px; }
.three { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 10px; }
fieldset { display: flex; flex-wrap: wrap; gap: 4px 16px; margin: 10px 0 0; padding: 0; border: 0; }
legend { padding: 0 0 4px; font-size: 13px; color: var(--muted); }
.check { display: flex; align-items: center; gap: 8px; min-height: 32px; font-size: 15px; color: var(--fg); }
.check input { width: 16px; min-height: 16px; height: 16px; margin: 0; accent-color: var(--accent); }
.check span { color: var(--muted); font-size: 13px; }
summary { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; color: var(--muted); cursor: pointer; list-style: none; border-radius: var(--r); }
summary::-webkit-details-marker { display: none; }
details[open] > summary > svg:first-child { transform: rotate(90deg); }
button { display: inline-flex; align-items: center; gap: 6px; min-height: 32px; padding: 4px 10px; font: inherit; font-size: 14px; color: var(--fg); background: var(--field); border: 1px solid var(--line); border-radius: var(--r); cursor: pointer; }
button:active { transform: translateY(1px); }
.go { justify-self: center; min-height: 40px; padding: 8px 32px; font-size: 15px; font-weight: 600; color: var(--bg); background: var(--accent); border-color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
#out { display: grid; gap: 12px; min-height: 52px; padding: 12px 16px; border: 1px solid var(--line); border-radius: var(--r); align-content: start; min-width: 0; }
.muted, .sec .line, small { color: var(--muted); }
small { font-size: 13px; }
.mono { font-family: var(--mono); font-size: 13px; overflow-wrap: anywhere; }
.bar { height: 3px; overflow: hidden; border-radius: var(--r); }
.bar::after { content: ""; display: block; width: 40%; height: 100%; background: var(--accent); animation: slide 1.1s linear infinite; }
@keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
@media (prefers-reduced-motion: reduce) { .bar::after { width: 100%; animation: none; } }
.head { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: start; }
.name { font-weight: 600; overflow-wrap: anywhere; }
.acts { display: flex; gap: 8px; }
.finds { display: grid; gap: 10px; padding: 0; list-style: none; }
.find { display: grid; grid-template-columns: 88px 1fr; column-gap: 12px; align-items: start; font-size: 14px; }
.find small { grid-column: 2; }
.sev { display: inline-flex; gap: 6px; align-items: center; font-weight: 600; white-space: nowrap; }
.sev svg { position: relative; top: -1px; }
.error { color: var(--danger); }
.ok { color: var(--accent); }
.tag { margin-right: 6px; font-size: 13px; font-weight: 600; color: var(--muted); }
.secs { border-top: 1px solid var(--line); }
.sec { border-bottom: 1px solid var(--line); }
.sec > summary { display: grid; grid-template-columns: 16px 104px 1fr; gap: 8px; align-items: start; width: 100%; padding: 8px 0; font-size: 14px; color: var(--fg); border-radius: 0; }
.sec > summary svg { position: relative; top: 2px; color: var(--muted); }
.sec .key { font-weight: 600; }
.sec .line { padding-top: 1px; font-size: 13px; overflow-wrap: anywhere; }
.sec .down { color: var(--fg); }
.body { display: grid; gap: 10px; padding: 0 0 12px 24px; font-size: 14px; min-width: 0; }
dl { display: grid; grid-template-columns: 112px 1fr; gap: 6px 12px; }
dt { color: var(--muted); font-size: 13px; padding-top: 1px; }
dd { min-width: 0; overflow-wrap: anywhere; }
dd > span, dd > small, li > span, li > small { display: block; }
.tree { padding-left: 16px; }
.wide { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { padding: 0 12px 6px 0; font-size: 12px; font-weight: 500; color: var(--muted); text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 6px 12px 0 0; vertical-align: top; }
th:last-child, td:last-child { padding-right: 0; }
td.c { white-space: nowrap; }
td.c svg { width: 14px; height: 14px; position: relative; top: 2px; margin-right: 4px; }
.chain { display: grid; gap: 8px; padding-left: 20px; }
.err { display: flex; gap: 8px; align-items: baseline; color: var(--danger); font-weight: 600; }
.err svg { position: relative; top: 3px; }
.hint { padding-left: 24px; }
footer { display: flex; justify-content: center; align-items: center; gap: 16px; font-size: 13px; }
footer a { display: inline-flex; color: var(--muted); border-radius: 4px; }
footer a:hover { color: var(--fg); }
footer svg { width: 18px; height: 18px; }
@media (max-width: 560px) {
  .row, .three, .head { grid-template-columns: 1fr; }
  .find { grid-template-columns: 1fr; }
  .find small { grid-column: 1; }
  .sec > summary { grid-template-columns: 16px 1fr; }
  .sec .line { grid-column: 2; }
  .body { padding-left: 0; }
  dl { grid-template-columns: 1fr; gap: 0 0; }
  dd { padding-bottom: 6px; }
}

<script>
const $ = s => document.querySelector(s);
const form = $("form"), out = $("#out"), domain = $("#domain");
const SECTIONS = { dns: "DNS", propagation: "Propagation", email: "Email", rdap: "Registration", tls: "Certificate", http: "Web" };
const SEV = { error: "Error", warning: "Warning", info: "Info" };

// Control characters from records and servers show as \u{1b}, as in the CLI: copied into a terminal, they'd act.
const ctl = (s, re = /[\0-\x1f\x7f-\x9f]/g) => s.replace(re, c => `\\u{${c.charCodeAt(0).toString(16)}}`);
// Every value from a report goes through esc; h`` escapes its ${} parts and returns markup that h`` won't escape again.
const esc = v => v == null || v === false ? "" : Array.isArray(v) ? v.map(esc).join("") : v instanceof Markup ? v.s
  : ctl(String(v), /[\0-\t\v-\x1f\x7f-\x9f]/g).replace(/[&<>"']/g, c => `&#${c.charCodeAt(0)};`);
function Markup(s) { this.s = s; }
const h = (s, ...v) => new Markup(s.reduce((a, str, i) => a + esc(v[i - 1]) + str));
const icon = (name, cls = "") => h`<svg class="${cls}" aria-hidden="true"><use href="#i-${name}"/></svg>`;
const plural = (n, word) => `${n} ${word}${n === 1 ? "" : "s"}`;
const cn = dn => (/CN=([^,]+)/.exec(dn || "") || [, dn])[1];
const date = t => t ? t.slice(0, 10) : "unknown";
const days = (from, to) => Math.round((Date.parse(to) - Date.parse(from)) / 864e5);

// The engine's hints name CLI flags; the page names its own controls.
const forPage = s => s && s
  .replace("Add --allow-private (or the page option)", "Turn on Allow private addresses under Options")
  .replace("Pass --dkim-selector with the s= value", "Enter the s= value")
  .replace(" of your mail.", " of your mail as the DKIM selector.")
  .replace("Pass --spf-ip to evaluate it for one sending IP.", "Enter a Sending IP for SPF under Options to evaluate it.")
  .replace("or pass --ca-file", "or run domain-check with --ca-file");

function summaryLine(r) {
  const c = r.counts, down = Object.keys(SECTIONS).filter(k => r[k]?.status === "unavailable" || r[k]?.status === "rate_limited").length;
  const parts = [c.errors && plural(c.errors, "error"), c.warnings && plural(c.warnings, "warning"), c.info && `${c.info} info`,
    down && (down === 1 ? "1 check couldn't run" : `${down} checks couldn't run`)].filter(Boolean);
  return `${parts.join(" · ") || "No problems found"} · checked ${r.checked_at.slice(11, 16)} UTC`;
}

// One line per section: the CLI's compact block, also used by Copy.
const LINES = {
  dns: s => {
    if (!s.exists) return "doesn't exist (NXDOMAIN)";
    const v = t => s.records[t].map(x => x.value).join(", ");
    return [s.cname_chain.length && `CNAME ${s.cname_chain.join(" → ")}`,
      ...["A", "AAAA", "MX", "NS"].map(t => s.records[t].length && `${t} ${v(t) === "0 ." ? "0 . (null MX)" : v(t)}`),
      `DNSSEC ${dnssec(s.dnssec)}`]
      .filter(Boolean).join(" · ");
  },
  propagation: s => {
    const silent = s.authoritative.filter(a => a.status !== "ok" && a.status !== "no_route").length;
    const differ = s.resolvers.flatMap(r => Object.entries(r.answers).filter(([, a]) => a.agrees === false).map(([t]) => `${r.name} differs on ${t}`));
    const base = s.consistent === null ? "no answers to compare"
      : s.consistent ? `consistent: ${s.authoritative.filter(a => a.status === "ok").length} nameserver addresses, ${s.resolvers.filter(r => r.status === "ok").length} resolvers agree on ${s.types.join(", ")}`
      : `not consistent: ${differ.join(", ")}`;
    return base + (silent ? ` · ${silent === 1 ? "1 nameserver address" : `${silent} nameserver addresses`} didn't answer` : "");
  },
  email: s => {
    const k = s.dkim.keys.filter(k => k.error || !k.revoked);
    return [`SPF ${s.spf ? `${s.spf.all || "no all"}, ${s.spf.lookups}/10 lookups` : "none"}`,
      `DMARC ${s.dmarc ? `p=${s.dmarc.tags.p}` : "none"}`,
      `DKIM ${k.length ? k.map(k => `${k.selector} ${k.error || (k.key_type === "ed25519" ? "Ed25519" : `RSA ${k.bits}`)}`).join(", ") : noDkim(s.dkim)}`,
      `MTA-STS ${s.mta_sts ? s.mta_sts.policy?.mode || "policy unavailable" : "none"}`,
      `TLS-RPT ${s.tls_rpt ? "yes" : "none"}`,
      `BIMI ${s.bimi ? (s.bimi.logo ? "logo" : "declined") : "none"}`]
      .map((p, i) => s.errors[MAIL[i]] ? `${p.split(" ")[0]} ${s.errors[MAIL[i]]}` : p).join(" · ");
  },
  rdap: s => !s.found ? "no registration record" : [s.registrar && `${s.registrar.name}${s.registrar.iana_id ? ` (${s.registrar.iana_id})` : ""}`,
    `created ${date(s.created)}`, s.expires && `expires ${date(s.expires)}`, s.domain_status.join(", ")].filter(Boolean).join(" · "),
  tls: s => !s.protocol ? (s.chain.length ? "TLS handshake failed" : `no TLS connection to ${s.address}`) : [cn(s.chain[0]?.subject), cn(s.chain[0]?.issuer), `until ${date(s.not_after)} (${plural(s.days_left, "day")})`,
    s.protocol?.replace("TLSv", "TLS "), s.trusted ? "trusted" : `not trusted: ${(s.trust_error || "").replace(/_/g, " ")}`].filter(Boolean).join(" · "),
  http: s => {
    const ch = c => c.error ? `${c.start.split(":")[0]}: ${c.error}` : c.start.split(":")[0] + c.hops.map(x => ` → ${x.status}${x.location ? ` ${x.location}` : ""}`).join("");
    const has = k => s.headers[k] ? "yes" : "no";
    return [ch(s.http), s.https.hops.length > 1 || s.https.error ? ch(s.https) : null,
      s.headers && `HSTS ${has("strict-transport-security")}`, s.headers && `CSP ${has("content-security-policy")}`].filter(Boolean).join(" · ");
  },
};
const dnssec = d => d.bogus ? "bogus" : !d.signed ? "unsigned" : d.validated_by.length ? "signed, validated" : "signed, not validated";
// The email parts in the Email line's order, as `errors` names them.
const MAIL = ["spf", "dmarc", "dkim", "mta_sts", "tls_rpt", "bimi"];
const noDkim = d => d.given ? `none at ${d.selectors.join(", ")}` : "none of 8 common selectors";
const line = (r, k) => r[k].status === "ok" ? LINES[k](r[k]) : `${r[k].status.replace("_", " ")}: ${r[k].reason}`;

// Section bodies, shown when a section is opened.
const dl = rows => h`<dl>${rows.filter(r => r[1] != null && r[1] !== "").map(([k, v]) => h`<dt>${k}</dt><dd>${v}</dd>`)}</dl>`;
const mono = v => h`<span class="mono">${v}</span>`;
const spfTree = nodes => h`<ul class="tree mono">${nodes.map(n => h`<li>${n.term}${n.error ? h` <span class="error">${n.error}</span>` : ""}${n.children.length ? spfTree(n.children) : ""}</li>`)}</ul>`;
function cell(a, row) {
  const [state, text] = row.status !== "ok" ? ["silent", row.status.replace("_", " ")] : !a ? ["missing", ""]
    : a.agrees === false ? ["differs", a.ttl] : !a.values.length ? ["missing", a.rcode === "NOERROR" ? "" : a.rcode] : ["agrees", a.ttl];
  return h`<td class="c ${state === "differs" ? "error" : state === "agrees" ? "ok" : "muted"}" title="${a ? a.values.join("\n") || a.rcode : row.status}">${icon(state)}${text}</td>`;
}
const BODIES = {
  dns: s => h`<div class="wide"><table><thead><tr><th>Type</th><th>Value</th><th>TTL</th></tr></thead><tbody>
    ${Object.entries(s.records).flatMap(([t, rs]) => rs.map(x => h`<tr><td>${t}</td><td class="mono">${x.value}</td><td>${x.ttl}</td></tr>`))}
    ${Object.entries(s.errors).map(([t, e]) => h`<tr><td>${t}</td><td class="muted">${e}</td><td></td></tr>`)}</tbody></table></div>
    ${dl([["Zone", s.zone], ["CNAME chain", s.cname_chain.join(" → ")], ["CAA", s.caa ? h`${s.caa.records.map(mono)}<small>at ${s.caa.found_at}</small>` : "none"],
      ["DNSSEC", h`<span>${dnssec(s.dnssec)}</span>${s.dnssec.ds.map(d => h`<small>DS key ${d.key_tag}, ${d.algorithm_name} (${d.algorithm})</small>`)}${s.dnssec.validated_by.length ? h`<small>validated by ${s.dnssec.validated_by.join(", ")}</small>` : ""}`],
      ["Resolver", s.resolver]])}`,
  propagation: s => h`<div class="wide"><table><thead><tr><th>Server</th>${s.types.map(t => h`<th>${t}</th>`)}</tr></thead><tbody>
    ${[...s.authoritative.map(a => [a.server, a]), ...s.resolvers.map(r => [r.name, r])].map(([name, row]) =>
      h`<tr><td>${name}<small class="mono"> ${row.address}</small></td>${s.types.map(t => cell(row.answers?.[t], row))}</tr>`)}</tbody></table></div>
    <small>${icon("agrees")} agrees with the nameservers, ${icon("differs")} differs, ${icon("missing")} no record, ${icon("silent")} no answer. Numbers are TTLs in seconds; hover a cell for the values.</small>
    ${s.varies.length ? h`<small>The nameservers' answers vary for ${s.varies.join(", ")}, so resolvers aren't compared for those.</small>` : ""}`,
  email: s => { const none = k => s.errors[k] ? h`<span class="error">${s.errors[k]}</span>` : "none"; return dl([
    ["MX", s.mx.kind === "mx" ? s.mx.hosts.map(m => h`<span>${m.preference} <span class="mono">${m.host}</span> <small>${m.addresses.join(", ") || m.error}</small></span>`) : { null_mx: "null MX: accepts no email", implicit: "none; mail goes to the A/AAAA address", none: "none" }[s.mx.kind]],
    ["SPF", s.spf ? h`${mono(s.spf.record)}<small>${s.spf.lookups}/10 DNS lookups, ${s.spf.void_lookups} void${s.spf.result ? h`, ${s.spf.result.ip}: ${s.spf.result.result}` : ""}</small>${s.spf.tree.length ? spfTree(s.spf.tree) : ""}` : none("spf")],
    ["DMARC", s.dmarc ? h`${mono(s.dmarc.record)}<small>at ${s.dmarc.found_at}${s.dmarc.inherited ? " (inherited)" : ""}${s.dmarc.historic_tags.length ? h`; no longer used: ${s.dmarc.historic_tags.join(", ")}` : ""}</small>` : none("dmarc")],
    ["DKIM", s.dkim.keys.length ? s.dkim.keys.map(k => h`<span><span class="mono">${k.name}</span> ${k.error ? h`<span class="error">${k.error}</span>` : h`<small>${k.revoked ? "revoked" : k.key_type === "ed25519" ? "Ed25519" : `RSA ${k.bits} bits`}${k.testing ? ", testing" : ""}</small>`}</span>`) : s.errors.dkim ? none("dkim") : noDkim(s.dkim)],
    ["MTA-STS", s.mta_sts ? h`${mono(s.mta_sts.record)}<small>${policy(s.mta_sts.policy)}</small>` : none("mta_sts")],
    ["TLS-RPT", s.tls_rpt ? mono(s.tls_rpt.record) : none("tls_rpt")],
    ["BIMI", s.bimi ? mono(s.bimi.record) : none("bimi")]]); },
  rdap: s => dl([["Registrar", s.registrar?.name], ["Created", date(s.created)], ["Expires", s.expires && date(s.expires)], ["Updated", s.updated && date(s.updated)],
    ["Status", s.domain_status.join(", ")], ["Nameservers", s.nameservers.join(", ")], ["DNSSEC", s.dnssec_delegation == null ? null : s.dnssec_delegation ? "delegation signed" : "not signed"],
    ["Server", h`<span class="mono">${s.server}</span><small>bootstrap ${s.bootstrap}</small>`]]),
  tls: s => h`${dl([["Connection", s.protocol ? `${s.address} port ${s.port}, ${s.protocol.replace("TLSv", "TLS ")}, ${s.cipher}${s.alpn ? `, ${s.alpn}` : ""}` : LINES.tls(s)],
    ["Trust", !s.protocol ? null : s.trusted ? "trusted by this computer" : h`<span class="error">${(s.trust_error || "").replace(/_/g, " ")}</span>${s.trust_detail ? h`<small>${s.trust_detail}</small>` : ""}`],
    ["Valid", s.not_after && `${date(s.not_before)} to ${date(s.not_after)}, ${plural(s.days_left, "day")} left of ${s.lifetime_days}`]])}
    <ol class="chain">${s.chain.map(c => h`<li><span>${cn(c.subject)}</span><small>issued by ${cn(c.issuer)}; ${c.key}, ${c.signature}; until ${date(c.not_after)}${c.self_signed ? "; self-signed" : ""}</small>${c.sans.length ? h`<small class="mono">${c.sans.join(", ")}</small>` : ""}</li>`)}</ol>`,
  http: s => h`${dl([["From http", hops(s.http)], ["From https", hops(s.https)]])}
    ${s.headers ? h`<div class="wide"><table><thead><tr><th>Header</th><th>Value</th></tr></thead><tbody>
    ${Object.entries(s.headers).filter(([k, v]) => v != null || !QUIET.test(k)).map(([k, v]) => h`<tr><td>${k}</td><td class="${v == null ? "muted" : "mono"}">${v ?? "missing"}</td></tr>`)}</tbody></table></div>` : ""}`,
};
// Obsolete and software-version headers are listed only when the server sends them.
const QUIET = /^(x-xss|expect-ct|public-key|feature-policy|server|x-powered|x-aspnet)/;
const policy = p => !p ? "policy not fetched" : p.error || `mode ${p.mode}, mx ${p.mx.join(", ")}, max_age ${p.max_age}`;
const hops = c => c.error ? h`<span class="error">${c.error}</span>` : h`<ol class="chain">${c.hops.map(x => h`<li class="mono">${x.status} ${x.url}</li>`)}</ol>`;

function render(res) {
  const r = res.reports[0];
  const findings = r.findings.map(f => h`<li class="find"><span class="sev ${f.severity === "error" ? "error" : ""}">${icon(f.severity)}${SEV[f.severity]}</span>
    <p><span class="tag">${SECTIONS[f.check] || f.check}</span>${f.message}</p>${f.hint ? h`<small>${forPage(f.hint)}</small>` : ""}</li>`);
  const secs = Object.keys(SECTIONS).filter(k => r[k]).map(k => h`<details class="sec"><summary>${icon("caret")}<span class="key">${SECTIONS[k]}</span>
    <span class="line ${r[k].status === "ok" ? "" : "down"}">${line(r, k)}</span></summary>${r[k].status === "ok" ? h`<div class="body">${BODIES[k](r[k])}</div>` : ""}</details>`);
  out.innerHTML = h`<div class="head"><div><div class="name">${r.unicode}${r.unicode !== r.domain ? h` <small class="mono">${r.domain}</small>` : ""}</div>
    <small>${summaryLine(r)}</small></div><div class="acts"><button type="button" data-copy>Copy</button><button type="button" data-save>Save</button></div></div>
    ${findings.length ? h`<ul class="finds">${findings}</ul>` : ""}<div class="secs">${secs}</div>
    <small>RDAP bootstrap ${res.data.rdap_bootstrap.slice(0, 10)} · domain-check ${res.data.version}</small>`.s;
  $("[data-copy]").onclick = e => navigator.clipboard.writeText(textReport(r)).then(() => flash(e.target, "Copied"), () => flash(e.target, "Can't copy"));
  $("[data-save]").onclick = () => {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([JSON.stringify(res, null, 2) + "\n"], { type: "application/json" }));
    a.download = `domain-check-${r.domain}.json`;
    a.click();
    URL.revokeObjectURL(a.href);
  };
}
const flash = (b, text) => { b.textContent = text; setTimeout(() => b.textContent = "Copy", 1500); };

function textReport(r) {
  const mark = { error: "✗", warning: "!", info: "i" }, w = Math.max(0, ...r.findings.map(f => f.check.length));
  return [`${r.domain}${r.unicode !== r.domain ? ` (${r.unicode})` : ""}  ${summaryLine(r)}`,
    ...r.findings.flatMap(f => [`${mark[f.severity]} ${f.check.padEnd(w)}  ${f.message}`, ...(f.hint ? [`${" ".repeat(w + 4)}${f.hint}`] : [])]),
    "", ...Object.keys(SECTIONS).filter(k => r[k]).map(k => `${SECTIONS[k].padEnd(13)}${line(r, k)}`)].map(l => ctl(l)).join("\n") + "\n";
}

const showError = (message, hint) => out.innerHTML = h`<p class="err">${icon("error")}${message}</p>${hint ? h`<p class="hint muted">${forPage(hint)}</p>` : ""}`.s;

let run = 0;
form.addEventListener("submit", async e => {
  e.preventDefault();
  const id = ++run, val = s => $(s).value.trim(), list = s => val(s).split(/[\s,]+/).filter(Boolean);
  const checks = [...document.querySelectorAll("[name=checks]:checked")].map(c => c.value);
  if (!checks.length) return showError("No checks are ticked.", "Tick at least one check under Options.");
  const body = { domain: domain.value };
  if (checks.length < 6) body.checks = checks;
  if (val("#selector")) body.dkim_selectors = list("#selector");
  if (val("#spf_ip")) body.spf_ip = val("#spf_ip");
  if (val("#types")) body.types = list("#types").map(t => t.toUpperCase());
  if (val("#dns_server")) body.dns_server = val("#dns_server");
  if ($("#allow_private").checked) body.allow_private = true;
  const started = Date.now(), names = checks.map(c => c === "dns" ? "DNS" : SECTIONS[c].toLowerCase()).join(", ").replace(/, ([^,]*)$/, " and $1");
  const tick = () => out.innerHTML = h`<div class="bar"></div><p class="muted">Checking ${val("#domain") || "the domain"}: ${names}… ${Math.floor((Date.now() - started) / 1000)} s</p>`.s;
  let timer, res;
  const wait = setTimeout(() => { tick(); timer = setInterval(tick, 1000); }, 150);
  out.setAttribute("aria-busy", "true");
  try { res = await api(body); } catch { res = null; }
  clearTimeout(wait); clearInterval(timer);
  if (id !== run) return;
  out.removeAttribute("aria-busy");
  const err = res?.error || res?.reports?.[0]?.error;
  if (!res) showError("Can't reach domain-check.", "Start it again with: domain-check ui");
  else if (err) showError(err.message, err.hint);
  else render(res);
  if (out.getBoundingClientRect().top > innerHeight - 80) out.scrollIntoView({ block: "start" });
});

addEventListener("keydown", e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "o") { e.preventDefault(); domain.focus(); domain.select(); }
});

async function api(body) {
  const json = JSON.stringify(body);
  // The server cuts off a larger request, which would read as no server at all.
  if (new Blob([json]).size > 64 * 1024) return { error: { code: "too_large", message: "The request is larger than 64 KB.", hint: "Check one domain at a time." } };
  const r = await fetch("/api", { method: "POST", headers: { "content-type": "application/json" }, body: json });
  return r.json();
}
</script>
</body>
</html>
