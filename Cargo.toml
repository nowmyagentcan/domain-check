[package]
name = "domain-check"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Check a domain's DNS and propagation, email security, RDAP registration, TLS certificate and HTTP headers"
repository = "https://github.com/nowmyagentcan/domain-check"
publish = false

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[dependencies]
anstream = "1.0"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
hickory-net = { version = "0.26.3", default-features = false, features = ["tokio"] }
hickory-proto = { version = "0.26.3", default-features = false, features = ["std"] }
hickory-resolver = { version = "0.26.3", default-features = false, features = ["system-config", "tokio"] }
idna = "1.1.0"
rmcp = { version = "3.8.0", default-features = false, features = ["server", "macros", "transport-io", "schemars"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8.5"
rustls-platform-verifier = "0.7.1"
schemars = "1.2.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
time = { version = "0.3.55", default-features = false, features = ["formatting", "parsing"] }
tokio = { version = "1.54", default-features = false, features = ["rt", "net", "time"] }
ureq = { version = "=3.5.0", default-features = false, features = ["rustls-no-provider", "platform-verifier"] }
url = "2.5.8"
x509-parser = "0.18.1"

[dev-dependencies]
rcgen = "0.14.10"
