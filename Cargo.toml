[package]
name = "domain-check"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Check a domain's DNS and propagation, email security, RDAP registration, TLS certificate and HTTP headers"
repository = "https://github.com/nowmyagentcan/domain-check"
publish = false

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[dependencies]
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
hickory-net = { version = "0.26.3", default-features = false, features = ["tokio"] }
hickory-proto = { version = "0.26.3", default-features = false, features = ["std"] }
hickory-resolver = { version = "0.26.3", default-features = false, features = ["system-config", "tokio"] }
idna = "1.1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
time = { version = "0.3.55", default-features = false, features = ["formatting"] }
tokio = { version = "1.54", default-features = false, features = ["rt", "net", "time"] }
